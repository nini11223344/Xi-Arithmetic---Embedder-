[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xi-arithmetic-embedder"
version = "0.1.0"
description = "Arithmetic embedder for embodied intelligence based on completeness space assessment"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Xi-Team", email = "contact@xi-ability.org"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy",
    "torch",
    "scipy",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov",
    "black",
    "isort",
]

[project.urls]
Homepage = "https://github.com/yourusername/Xi-Arithmetic-Embedder"
Repository = "https://github.com/yourusername/Xi-Arithmetic-Embedder.git"
Documentation = "https://github.com/yourusername/Xi-Arithmetic-Embedder/blob/main/docs/design_documentation.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
